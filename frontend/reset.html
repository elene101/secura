<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Choose a new password – Secura GE</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sg_theme')||'dark'}catch(e){}</script>
</head>
<body class="frame app-page utility-page">
<header class="top">
  <a class="logo" href="/"><img src="/logo.png" width="30" height="30" alt="">Secura<span>GE</span></a>
  <div class="bar"><nav><a href="/">Back to site</a></nav></div>
  <div class="acct"><div id="prefs" class="prefs"></div></div>
</header>
<main id="main" class="rev utility-main">
  <div class="studio-card utility-card">
  <h1>Choose a new password</h1>
  <form class="pcard form" id="rForm">
    <label>New password<input id="np" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
    <label>Repeat new password<input id="np2" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
    <p class="err" id="rMsg" role="alert"></p>
    <button class="primary">Save new password</button>
  </form>
  <p class="notice" id="done" hidden><span>Your password was changed. You can log in now.</span> <a class="btn" href="/auth.html">Log in</a></p>
  </div>
</main>
<script type="module" src="/src/reset.js"></script>
</body>
</html>
