<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews – Secura GE</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sg_theme')||'dark'}catch(e){}</script>
</head>
<body class="frame app-page reviews-page">
<header class="top">
  <a class="logo" href="/"><img src="/logo.png" width="30" height="30" alt="">Secura<span>GE</span></a>
  <div class="bar"><nav><a href="/">Back to site</a></nav></div>
  <div class="acct"><div id="prefs" class="prefs"></div></div>
</header>
<main class="app-main reviews-main" id="main" data-views>
  <div class="section-heading page-intro"><h1>Reviews</h1><p class="summary" id="summary"></p></div>
  <div class="view-tabs" role="tablist" aria-label="Reviews">
    <button type="button" data-tab="reviews">Customer reviews</button><button type="button" data-tab="write-review">Your review</button>
  </div>
  <section id="reviews-read" class="reviews-list-panel" data-view="reviews">
    <div id="list"></div><div class="page-controls" id="reviewPages"></div>
  </section>
  <section id="reviews-write" data-view="write-review" hidden>
    <p class="muted">Tell us how Secura GE worked for you.</p>
  <p id="loginNote" class="notice" hidden>Please <a href="/auth.html">log in</a> to leave a review.</p>
  <form class="pcard form" id="revForm" hidden>
    <fieldset><legend>How useful was Secura GE for you?</legend><div class="stars" id="stars" role="radiogroup" aria-label="Rating"></div></fieldset>
    <fieldset><legend>What did you use?</legend><div class="used" id="used"></div></fieldset>
    <label>Your comment<textarea id="comment" maxlength="1000" rows="4" placeholder="What worked well? What could be better?"></textarea></label>
    <p class="err" id="rvMsg" role="status"></p>
    <button class="primary" id="rvBtn">Send review</button>
  </form>
  </section>
</main>
<script type="module" src="/src/reviews.js"></script>
</body>
</html>
